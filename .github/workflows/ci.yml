name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare MSVC environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Find or install curl (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $curlRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          $curlLib = Join-Path $curlRoot "lib\libcurl.lib"
          if (-not (Test-Path $curlLib)) {
            Write-Host "libcurl.lib not found at $curlLib; installing curl:x64-windows."
            vcpkg install curl:x64-windows
          }
          if (-not (Test-Path $curlLib)) {
            throw "libcurl.lib is still missing after vcpkg install: $curlLib"
          }
          Write-Host "Using libcurl import library: $curlLib"
          "GAMEJOLT_CURL_LIB_DIR=$curlRoot\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$curlRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install native dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libcurl4-openssl-dev

      - name: Install native dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install curl

      # Pin one known Odin release instead of resolving "latest" through the
      # GitHub API on every runner (which can be rate-limited or return 403).
      - name: Install Odin (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $url = "https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-windows-amd64-dev-2026-10.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\odin.zip"
          Expand-Archive "$env:RUNNER_TEMP\odin.zip" -DestinationPath "$env:RUNNER_TEMP\odin" -Force
          $compiler = Get-ChildItem "$env:RUNNER_TEMP\odin" -Filter odin.exe -Recurse | Select-Object -First 1
          if (-not $compiler) { throw "odin.exe was not found in the downloaded archive" }
          $odinRoot = $compiler.Directory.FullName
          "$odinRoot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $compiler.FullName version

      - name: Install Odin (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-linux-amd64-dev-2026-10.tar.gz"
          mkdir -p "$RUNNER_TEMP/odin"
          curl --fail --location --retry 3 --retry-all-errors "$url" -o "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          test -x "$RUNNER_TEMP/odin/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/odin/odin" version

      - name: Install Odin (macOS Apple Silicon)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) archive="odin-macos-arm64-dev-2026-10.tar.gz" ;;
            *) echo "Unsupported macOS runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/odin-lang/Odin/releases/download/dev-2026-10/$archive"
          mkdir -p "$RUNNER_TEMP/odin"
          curl --fail --location --retry 3 --retry-all-errors "$url" -o "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          test -x "$RUNNER_TEMP/odin/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/odin/odin" version

      - name: Run unit, shared-library, and C ABI tests (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\run_tests.bat

      - name: Run unit, shared-library, and C ABI tests (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          chmod +x ./run_tests.sh ./build.sh
          ./run_tests.sh
