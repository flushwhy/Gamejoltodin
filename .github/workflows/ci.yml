name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare MSVC environment (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install native dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          vcpkg install curl:x64-windows
          $curlRoot = Join-Path $vcpkgRoot "installed\x64-windows"
          "GAMEJOLT_CURL_LIB_DIR=$curlRoot\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$curlRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install native dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libcurl4-openssl-dev

      - name: Install native dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install curl

      - name: Install Odin (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/odin-lang/Odin/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*windows-amd64*" -and $_.name -match "\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "No Windows Odin archive found" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile odin.zip
          Expand-Archive odin.zip -DestinationPath odin-temp -Force
          $folder = Get-ChildItem odin-temp | Select-Object -First 1
          Move-Item $folder.FullName "odin"
          "${{ github.workspace }}\odin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Odin (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux) platform="linux-amd64" ;;
            Darwin)
              case "$(uname -m)" in
                arm64) platform="macos-arm64" ;;
                *) platform="macos-amd64" ;;
              esac
              ;;
          esac
          response="$(curl --fail --silent --show-error https://api.github.com/repos/odin-lang/Odin/releases/latest"
          asset_url="$(printf '%s' "$response" | jq -r --arg platform "$platform" '.assets[]? | select(.name | contains($platform)) | select(.name | test("\\.tar\\.(gz|xz)$")) | .browser_download_url' | head -n 1)"
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "No Odin archive found for $platform" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/odin"
          curl --fail --location --silent --show-error "$asset_url" -o "$RUNNER_TEMP/odin-archive"
          tar -xf "$RUNNER_TEMP/odin-archive" -C "$RUNNER_TEMP/odin" --strip-components=1
          chmod +x "$RUNNER_TEMP/odin/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Run test suite
        shell: pwsh
        if: matrix.platform == 'windows'
        run: .\run_tests.bat

      - name: Run test suite
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          chmod +x ./run_tests.sh ./build.sh
          ./run_tests.sh
