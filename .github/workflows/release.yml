name: Release

# -------------------------------------------------
# When to run the workflow
# -------------------------------------------------
on:
  push:
    tags:
      - 'v*'               # e.g. v1.2.3
  workflow_dispatch:        # lets you trigger it manually too

# -------------------------------------------------
# Jobs
# -------------------------------------------------
jobs:
  build-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            odin_platform: windows-amd64
            lib_ext: dll
          - os: macos-latest
            platform: macos
            odin_platform: macos-amd64
            lib_ext: dylib
          - os: ubuntu-latest
            platform: linux
            odin_platform: ubuntu-amd64
            lib_ext: so
    runs-on: ${{ matrix.os }}
    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout the repository
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2️⃣ Install the latest Odin release (Windows)
      # -------------------------------------------------
      - name: Install Odin (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/odin-lang/Odin/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*${{ matrix.odin_platform }}*" } | Select-Object -First 1
          if (-not $asset) { throw "No Odin asset found for ${{ matrix.odin_platform }}" }
          Write-Host "Using Odin release: $($release.tag_name) -> $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile odin_archive
          Expand-Archive odin_archive -DestinationPath odin -Force
          $odinBin = Join-Path (Get-Location) "odin\odin.exe"
          echo "$odinBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # -------------------------------------------------
      # 2️⃣ Install the latest Odin release (macOS / Linux)
      # -------------------------------------------------
      - name: Install Odin (macOS/Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          assetUrl=$(curl -s https://api.github.com/repos/odin-lang/Odin/releases/latest \
            | jq -r --arg p "${{ matrix.odin_platform }}" '.assets[] | select(.name | contains($p)) | .browser_download_url' \
            | head -n1)
          if [ -z "$assetUrl" ]; then
            echo "No Odin asset found for ${{ matrix.odin_platform }}"; exit 1
          fi
          echo "Downloading: $assetUrl"
          curl -L -o odin_archive "$assetUrl"
          mkdir -p odin
          if [[ "$assetUrl" == *.zip ]]; then
            unzip -q odin_archive -d odin
          else
            tar -xzf odin_archive -C odin
          fi
          chmod +x odin/odin
          echo "$(pwd)/odin" >> "$GITHUB_PATH"

      # -------------------------------------------------
      # 3️⃣ Build the shared library
      # -------------------------------------------------
      - name: Build GameJolt library (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\build.bat

      - name: Build GameJolt library (macOS/Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh

      # -------------------------------------------------
      # 4️⃣ Create the zip archive
      # -------------------------------------------------
      - name: Create release zip (Windows)
        if: matrix.platform == 'windows'
        id: zip_windows
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $zipName = "odinJolt_${version}_windows.zip"
          $files = @("bin\gamejolt.dll", "gamejolt.h", "README.md", ".gitignore")
          Compress-Archive -Path $files -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create release zip (macOS/Linux)
        if: matrix.platform != 'windows'
        id: zip_unix
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          zipName="odinJolt_${version}_${{ matrix.platform }}.zip"
          zip -j "$zipName" "bin/gamejolt.${{ matrix.lib_ext }}" gamejolt.h README.md .gitignore
          echo "zip_name=$zipName" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------
      # 5️⃣ Publish the zip as a GitHub Release
      # -------------------------------------------------
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OdinJolt ${{ github.ref_name }}"
          files: ${{ steps.zip_windows.outputs.zip_name || steps.zip_unix.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}