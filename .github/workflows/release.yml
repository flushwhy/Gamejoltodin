name: Release

# Flow:
#   feature branches -> PR into develop
#   develop          -> PR into main/master  (merge commit, NOT squash)
#   push to main     -> release-please opens/updates a "release PR"
#   release PR merged-> release-please tags + creates the GitHub Release,
#                       then the build jobs below attach the platform zips.

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  # -------------------------------------------------
  # 0️⃣ release-please: maintain release PR / cut release
  # -------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          release-type: simple

  # -------------------------------------------------
  # Build + attach assets, only when a release was just created
  # -------------------------------------------------
  build-and-package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            odin_platform: windows-amd64
            lib_prefix: ""
            lib_ext: dll
          - os: macos-latest
            platform: macos
            odin_platform: macos-amd64
            lib_prefix: "lib"
            lib_ext: dylib
          - os: ubuntu-latest
            platform: linux
            odin_platform: linux-amd64
            lib_prefix: "lib"
            lib_ext: so
    runs-on: ${{ matrix.os }}
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout repository (at the release tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # -------------------------------------------------
      # 1️⃣ Install Odin (Windows)
      # -------------------------------------------------
      - name: Install Odin (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $headers = @{ "Authorization" = "token $($env:GITHUB_TOKEN)" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/odin-lang/Odin/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "*${{ matrix.odin_platform }}*" } | Select-Object -First 1
          if (-not $asset) { throw "No Odin asset found for ${{ matrix.odin_platform }}" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile odin_archive
          Expand-Archive odin_archive -DestinationPath odin_temp -Force
          $extractedFolder = Get-ChildItem odin_temp | Select-Object -First 1
          Move-Item "$($extractedFolder.FullName)" "odin"
          Remove-Item odin_temp -Recurse -Force
          $odinBin = Join-Path (Get-Location) "odin\odin.exe"
          echo "$odinBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------
      # 1️⃣ Install Odin (macOS via Homebrew) 🍺
      # -------------------------------------------------
      - name: Install Odin (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install odin

      # -------------------------------------------------
      # 1️⃣ Install Odin (Linux)
      # -------------------------------------------------
      - name: Install Odin (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/odin-lang/Odin/releases/latest)
          assetUrl=$(echo "$response" | jq -r --arg p "linux-amd64" '.assets[]? | select(.name | contains($p)) | .browser_download_url' | head -n1)

          if [ -z "$assetUrl" ] || [ "$assetUrl" = "null" ]; then
            echo "Error: No Odin asset found for linux-amd64"
            exit 1
          fi

          curl -L -o odin_archive "$assetUrl"
          mkdir -p odin
          tar -xzf odin_archive -C odin --strip-components=1
          chmod +x odin/odin
          echo "$(pwd)/odin" >> "$GITHUB_PATH"

      # -------------------------------------------------
      # 2️⃣ Install Linux Dependencies
      # -------------------------------------------------
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libmbedtls-dev

      # -------------------------------------------------
      # 3️⃣ Build the shared library
      # -------------------------------------------------
      - name: Build GameJolt library (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\build.bat

      - name: Build GameJolt library (macOS/Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh

      # -------------------------------------------------
      # 4️⃣ Create the zip archive
      # -------------------------------------------------
      - name: Create release zip (Windows)
        if: matrix.platform == 'windows'
        id: zip_windows
        shell: pwsh
        run: |
          $version = $env:TAG_NAME -replace '^v',''
          $zipName = "odinJolt_${version}_windows.zip"
          $files = @("bin\gamejolt.dll", "gamejolt.h", "README.md", ".gitignore")
          $validFiles = $files | Where-Object { Test-Path $_ }
          Compress-Archive -Path $validFiles -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create release zip (macOS/Linux)
        if: matrix.platform != 'windows'
        id: zip_unix
        shell: bash
        run: |
          version="${TAG_NAME#v}"
          zipName="odinJolt_${version}_${{ matrix.platform }}.zip"
          # Uses the correct bin/ directory and lib prefix (e.g., bin/libgamejolt.so)
          zip -j "$zipName" "bin/${{ matrix.lib_prefix }}gamejolt.${{ matrix.lib_ext }}" gamejolt.h README.md .gitignore
          echo "zip_name=$zipName" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------
      # 5️⃣ Attach the zip to the release release-please created
      #    (no `name`/`body` so release-please's changelog notes are kept)
      # -------------------------------------------------
      - name: Upload asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ${{ steps.zip_windows.outputs.zip_name || steps.zip_unix.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}