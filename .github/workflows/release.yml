name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            lib_path: bin/gamejolt.dll
          - os: macos-latest
            platform: macos
            lib_path: bin/libgamejolt.dylib
          - os: ubuntu-latest
            platform: linux
            lib_path: bin/libgamejolt.so
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install native dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install curl -y --no-progress

      - name: Install native dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libcurl4-openssl-dev

      - name: Install native dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install curl

      - name: Install Odin (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/odin-lang/Odin/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*windows-amd64*" -and $_.name -match "\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "No Windows Odin archive found" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile odin.zip
          Expand-Archive odin.zip -DestinationPath odin-temp -Force
          $folder = Get-ChildItem odin-temp | Select-Object -First 1
          Move-Item $folder.FullName "odin"
          "${{ github.workspace }}\odin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Odin (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux) platform="linux-amd64" ;;
            Darwin)
              case "$(uname -m)" in
                arm64) platform="macos-arm64" ;;
                *) platform="macos-amd64" ;;
              esac
              ;;
          esac
          response="$(curl --fail --silent --show-error https://api.github.com/repos/odin-lang/Odin/releases/latest)"
          asset_url="$(printf '%s' "$response" | jq -r --arg platform "$platform" '.assets[]? | select(.name | contains($platform)) | select(.name | test("\\.tar\\.(gz|xz)$")) | .browser_download_url' | head -n 1)"
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "No Odin archive found for $platform" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/odin"
          curl --fail --location --silent --show-error "$asset_url" -o "$RUNNER_TEMP/odin-archive"
          tar -xf "$RUNNER_TEMP/odin-archive" -C "$RUNNER_TEMP/odin" --strip-components=1
          chmod +x "$RUNNER_TEMP/odin/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Build shared library
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            ./build.bat
          else
            chmod +x ./build.sh
            ./build.sh
          fi

      - name: Package release artifact
        shell: bash
        run: |
          version="${TAG_NAME#v}"
          archive="odinJolt_${version}_${{ matrix.platform }}.zip"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a "$archive" bin/gamejolt.dll gamejolt.h README.md
          else
            zip -j "$archive" "${{ matrix.lib_path }}" gamejolt.h README.md
          fi
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ${{ env.RELEASE_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
