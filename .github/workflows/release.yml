name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            lib_path: bin/gamejolt.dll
          - os: macos-latest
            platform: macos
            lib_path: bin/libgamejolt.dylib
          - os: ubuntu-latest
            platform: linux
            lib_path: bin/libgamejolt.so
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Prepare MSVC environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install curl (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows
          $curlRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          if (-not (Test-Path "$curlRoot\lib\libcurl.lib")) {
            throw "vcpkg did not install libcurl.lib under $curlRoot"
          }
          "GAMEJOLT_CURL_LIB_DIR=$curlRoot\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$curlRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install native dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libcurl4-openssl-dev zip

      - name: Install native dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install curl

      - name: Install Odin (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $url = "https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-windows-amd64-dev-2026-10.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\odin.zip"
          Expand-Archive "$env:RUNNER_TEMP\odin.zip" -DestinationPath "$env:RUNNER_TEMP\odin" -Force
          $compiler = Get-ChildItem "$env:RUNNER_TEMP\odin" -Filter odin.exe -Recurse | Select-Object -First 1
          if (-not $compiler) { throw "odin.exe was not found in the downloaded archive" }
          "$($compiler.Directory.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $compiler.FullName version

      - name: Install Odin (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-linux-amd64-dev-2026-10.tar.gz"
          mkdir -p "$RUNNER_TEMP/odin"
          curl --fail --location --retry 3 --retry-all-errors "$url" -o "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          test -x "$RUNNER_TEMP/odin/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/odin/odin" version

      - name: Install Odin (macOS Apple Silicon)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "Unsupported macOS runner architecture: $(uname -m)" >&2
            exit 1
          fi
          url="https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-macos-arm64-dev-2026-10.tar.gz"
          mkdir -p "$RUNNER_TEMP/odin"
          curl --fail --location --retry 3 --retry-all-errors "$url" -o "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          test -x "$RUNNER_TEMP/odin/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/odin/odin" version

      - name: Build shared library (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\build.bat

      - name: Build shared library (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Package release artifact (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          $archive = "odinJolt_$($version)_windows.zip"
          Compress-Archive -Path bin\gamejolt.dll, gamejolt.h, README.md -DestinationPath $archive -Force
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package release artifact (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          version="${TAG_NAME#v}"
          archive="odinJolt_${version}_${{ matrix.platform }}.zip"
          zip -j "$archive" "${{ matrix.lib_path }}" gamejolt.h README.md
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ${{ env.RELEASE_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
